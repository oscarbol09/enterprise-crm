name: Enterprise CRM CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  security-secret-scan:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-test-and-security:
    name: Backend Lint, Typecheck, Security & Postgres RLS Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_secure_pass
          POSTGRES_DB: crm_enterprise_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U crm_user -d crm_enterprise_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install PostgreSQL client & Python dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Lint with Ruff
        working-directory: backend
        run: ruff check src tests

      - name: Typecheck with Mypy
        working-directory: backend
        run: mypy src

      - name: Security SAST with Bandit
        working-directory: backend
        run: bandit -r src -ll

      - name: Dependency Vulnerability Audit (pip-audit)
        working-directory: backend
        run: pip-audit --desc on

      - name: Verify Alembic Migration & Raw Schema DDL on Postgres 16
        working-directory: backend
        env:
          PGPASSWORD: crm_secure_pass
          MIGRATION_DATABASE_URL: postgresql+asyncpg://crm_user:crm_secure_pass@localhost:5432/crm_enterprise_db
        run: |
          alembic upgrade head
          psql -h localhost -U crm_user -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE crm_schema_check;"
          psql -h localhost -U crm_user -d crm_schema_check -v ON_ERROR_STOP=1 -f ../database/schema.sql

      - name: Run Pytest Suite + Forced RLS & pgvector Integration Tests
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://crm_app:crm_app_dev_pass@localhost:5432/crm_enterprise_db
          REDIS_URL: redis://localhost:6379/0
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80

  frontend-verify:
    name: Frontend Audit, Typecheck, Lint, Vitest & Next Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies cleanly
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate

      - name: TypeScript strict typecheck
        run: npm run typecheck

      - name: ESLint code quality check
        run: npm run lint

      - name: Run Vitest + MSW suite with coverage
        run: npm run test:coverage

      - name: Build production Next.js bundle
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build

  container-security-scan:
    name: Docker Hardening & Trivy Scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [backend-test-and-security, frontend-verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            image: enterprise-crm-backend:ci
            expected_uid: "10001"
            build_args: ""
          - component: frontend
            context: ./frontend
            image: enterprise-crm-frontend:ci
            expected_uid: "10001"
            build_args: "NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build hardened container image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ matrix.image }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Verify non-root container UID
        run: |
          ACTUAL_UID=$(docker run --rm --entrypoint id ${{ matrix.image }} -u)
          echo "Running UID=${ACTUAL_UID}"
          test "${ACTUAL_UID}" = "${{ matrix.expected_uid }}"

      - name: Trivy vulnerability scan (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
